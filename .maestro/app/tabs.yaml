appId: ${APP_ID}
env:
  Name: User
  EMAIL: user@test.com
  PASSWORD: password
---
- launchApp
- runFlow: ../utils/onboarding-and-login.yaml
- assertVisible: Feed
# Native tab items expose testID as accessibility id on iOS only, so match
# the visible labels to keep the flow working on both platforms.
- assertVisible: Style
- tapOn: Style
- assertVisible: Typography
- tapOn: Settings
- assertVisible: Settings
- scroll
- assertVisible: Logout
